[package]
name = "osgrep-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for osgrep - semantic code search for Claude Code"
license = "Apache-2.0"

[[bin]]
name = "osgrep-mcp"
path = "src/main.rs"

[dependencies]
# MCP protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

# Shared with CLI
anyhow = "1.0"

# Optional: link to CLI crate for shared functionality
# osgrep = { path = "../cli" }
