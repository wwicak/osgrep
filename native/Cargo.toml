[package]
name = "osgrep-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Enable parallel processing (adds ~200KB to binary)
parallel = ["rayon"]
# Enable native embeddings with candle (replaces transformers.js)
embeddings = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "hf-hub", "serde_json"]
# Metal acceleration for Apple Silicon (M1/M2/M3)
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
rayon = { version = "1.10", optional = true }

# Candle ML framework (optional, for native embeddings)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.3", optional = true }
serde_json = { version = "1.0", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
