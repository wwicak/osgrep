[package]
name = "osgrep-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Enable parallel processing (adds ~200KB to binary)
parallel = ["rayon"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
rayon = { version = "1.10", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
