[package]
name = "osgrep-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Enable nightly features for inline assembly
nightly = []

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
rayon = "1.10"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
# Enable all CPU features for maximum performance
# Uncomment for native builds: rustflags = ["-C", "target-cpu=native"]

[profile.release.build-override]
opt-level = 3
