name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run typecheck

      - name: Run tests (JS fallback mode)
        run: pnpm run test

      - name: Verify SIMD fallback works
        run: |
          node -e "
            const simd = require('./src/lib/simd');
            console.log('Native available:', simd.isNativeAvailable());
            console.log('SIMD level:', simd.getSimdLevel());
            const result = simd.benchmark(1000);
            console.log('Benchmark (JS fallback):', result);
            if (result.opsPerSecond < 100000) {
              console.error('Performance too low!');
              process.exit(1);
            }
          "

      - name: Build
        run: pnpm run build

